// Shairport Sync - Radxa Dragon Q6A
// Adaptat de la configuració de la Raspberry Pi (IQaudIO DAC).
// Referència completa de totes les opcions: /usr/local/share/doc/shairport-sync o el sample del projecte.

general =
{
//  name = "%H";                                   // nom AirPlay (per defecte: hostname amb majúscula)
    interpolation = "soxr";                        // la CPU de la Q6A ho aguanta de sobres
    output_backend = "alsa";
    mdns_backend = "avahi";
    playback_mode = "stereo";
    eight_channel_mode = "off";
    six_channel_mode = "off";
    volume_control_profile = "dasl_tapered";
    volume_control_combined_hardware_priority = "yes";
    volume_range_db = 60;                          // el control va de silenci a 0 dB; n'aprofitem 60 dB
    // El DSP arrodoneix el buffer ALSA a 7680 frames (160 ms), menys que el valor per defecte (0,2 s).
    audio_backend_buffer_desired_length_in_seconds = 0.12;
};

sessioncontrol =
{
    allow_session_interruption = "yes";
    session_timeout = 60;                          // shairport 5 exigeix 0 o >= 60
};

alsa =
{
    // Auriculars de la placa (dispositiu 0), directament a hw:.
    // AirPlay 2 envia sempre AAC/48000 (comprovat amb Tidal normal i hi-res): sense
    // conversió de freqüència. S16_LE i no S24_LE: shairport-sync escriu S24_LE amb el
    // byte alt a zero (sense extensió de signe) i el DSP llegeix paraules de 32 bits,
    // cosa que dona distorsió total. El volum es fa al DSP i la sortida cap al còdec
    // és S24 (qcs6490-hifi), així que baixar el volum no perd resolució.
    output_device = "hw:CARD=QCS6490RadxaDra,DEV=0";
    output_rate = 48000;
    output_format = "S16_LE";

    // Volum de maquinari, com el control "Digital" del PCM5122: el volum del
    // mòbil/ordinador mou el volum digital del DSP (MultiMedia1). "airplay" és un
    // ctl definit a /etc/asound.conf (plugin alsa-ctl-filter) que dona l'escala dB
    // correcta; el control del driver la té mal declarada.
    mixer_device = "airplay";
    mixer_control_name = "AirPlay";

    output_channels = 2;

    // Blocs petits: amb els valors per defecte (~340 ms) el DSP de Qualcomm s'encallava.
    period_size = 1024;
    buffer_size = 8192;
    use_mmap_if_available = "no";

    use_hardware_mute_if_available = "no";

    // Manté el DAC obert durant tota la sessió AirPlay (entre cançons, pauses curtes):
    // evita "pops" a l'amplificador quan l'amplificador d'auriculars s'engega/apaga.
    disable_standby_mode = "auto";
};

dsp =
{
    loudness_enabled = "no";
    loudness_reference_volume_db = -6.0;
};

metadata =
{
    enabled = "yes";
    include_cover_art = "yes";
};

// Mosquitto corre en Docker en aquesta placa (port 1883), així que 127.0.0.1 continua sent vàlid.
mqtt =
{
    enabled = "yes";
    hostname = "127.0.0.1";
    port = 1883;
    topic = "shairport";
    publish_parsed = "yes";
    publish_cover = "yes";
    enable_remote = "yes";
};

diagnostics =
{
    log_verbosity = 0;                             // 1-3 només per depurar
};
