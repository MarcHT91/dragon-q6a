# /etc/asound.conf - Radxa Dragon Q6A
# Control de volum de maquinari per a shairport-sync (AirPlay):
# el volum del mòbil/ordinador mou el volum digital del DSP (MultiMedia1 = auriculars),
# com feia el control "Digital" del PCM5122.
ctl_type.filter {
    lib "/usr/local/lib/alsa-lib/libasound_module_ctl_filter.so"
}
ctl.airplay {
    type filter
    card QCS6490RadxaDra
    controls [
        # 0..8192 lineal (8192 = guany 1,0 = 0 dB); escala dB correcta per a shairport
        { name "AirPlay Playback Volume"
          source "stream0.vol_ctrl0 MultiMedia1 Playback Volu" max 8192 linear_db true }
    ]
}
