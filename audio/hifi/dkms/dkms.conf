PACKAGE_NAME="qcs6490-hifi"
PACKAGE_VERSION="0.6"
BUILT_MODULE_NAME[0]="snd-soc-sc8280xp"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="snd-q6apm"
DEST_MODULE_LOCATION[1]="/updates/dkms"
PRE_BUILD="prepare.sh ${kernelver} ${kernel_source_dir}"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build KBUILD_EXTRA_SYMBOLS=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/installed.symvers KBUILD_MODPOST_WARN=1 modules"
CLEAN="rm -rf src installed.symvers .module-common.o *.o *.ko *.mod* modules.order Module.symvers .*.cmd"
AUTOINSTALL="yes"
